<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP-WASM Server</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f5; font-family: system-ui, sans-serif; }
    #status-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 35px;
      background: #18181b;
      color: #fafafa;
      padding: 0 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      border-bottom: 1px solid #27272a;
    }
    #viewport {
      width: 100%;
      height: calc(100% - 35px);
      margin-top: 35px;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <span id="status-text">⏳ PHP Engine চালু হচ্ছে...</span>
    <span id="current-file" style="color: #a1a1aa;">htdocs/index.php</span>
  </div>

  <iframe id="viewport"></iframe>

  <script type="module">
    import { PhpWeb } from 'https://cdn.jsdelivr.net/npm/php-wasm/PhpWeb.mjs';

    // htdocs ফোল্ডারের ফাইলগুলোর তালিকা
    const HTDOCS_FILES = [
      'index.php',
      'about.php',
      'header.php'
    ];

    let php;
    const statusText = document.getElementById('status-text');
    const currentFile = document.getElementById('current-file');
    const viewport = document.getElementById('viewport');

    async function initServer() {
      try {
        statusText.textContent = '📥 PHP Runtime ডাউনলোড ও চালু হচ্ছে...';
        php = new PhpWeb();

        // 1. ভার্চুয়াল ফোল্ডার তৈরি
        try {
          await php.mkdir('/htdocs');
        } catch(e) {
          // ফোল্ডার আগে থেকে থাকলে ইগনোর করবে
        }

        // 2. GitHub থেকে htdocs এর ফাইলগুলো ফেচ করে সরাসরি WASM মেমোরিতে রাইট করা
        statusText.textContent = '📥 htdocs ফাইল লোড হচ্ছে...';
        for (const file of HTDOCS_FILES) {
          try {
            const res = await fetch(`./htdocs/${file}?nocache=${Date.now()}`);
            if (res.ok) {
              const code = await res.text();
              // php.writeFile ব্যবহার করায় বাংলা বা ইউনিকোড ক্র্যাশ করবে না
              await php.writeFile(`/htdocs/${file}`, code);
              console.log(`[Loaded]: /htdocs/${file}`);
            } else {
              console.warn(`[Not Found on GitHub]: htdocs/${file} (HTTP ${res.status})`);
            }
          } catch (e) {
            console.error(`Fetch error for ${file}:`, e);
          }
        }

        statusText.textContent = '🟢 Server Running';
        statusText.style.color = '#4ade80';

        // URL থেকে প্যারামিটার রিড করা (?page=about.php)
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('page') || 'index.php';
        await executePHP(targetPage);

      } catch (err) {
        statusText.textContent = '❌ Boot Error: ' + err.message;
        statusText.style.color = '#f87171';
        console.error(err);
      }
    }

    async function executePHP(filename) {
      currentFile.textContent = `htdocs/${filename}`;
      let outputHTML = '';

      // আউটপুট রিসিভ করা
      const onOutput = (event) => {
        const text = Array.isArray(event.detail) ? event.detail.join('') : event.detail;
        outputHTML += text;
      };

      php.addEventListener('output', onOutput);

      try {
        // ফাইলটি এক্সিকিউট করা
        const runner = `<?php
          chdir('/htdocs');
          $_SERVER['DOCUMENT_ROOT'] = '/htdocs';
          $_SERVER['REQUEST_METHOD'] = 'GET';
          $_SERVER['SCRIPT_NAME'] = '/${filename}';

          if (file_exists('/htdocs/${filename}')) {
              include '/htdocs/${filename}';
          } else {
              echo "<div style='font-family:sans-serif;padding:30px;color:#dc2626;'>";
              echo "<h2>404 Not Found</h2>";
              echo "<p>ফাইল <strong>/htdocs/${filename}</strong> খুঁজে পাওয়া যায়নি!</p>";
              echo "</div>";
          }
        ?>`;

        await php.run(runner);
        viewport.srcdoc = outputHTML;

        // আইফ্রেমের অভ্যন্তরীণ লিংকগুলো ইন্টারসেপ্ট করা
        viewport.onload = () => {
          try {
            const doc = viewport.contentWindow.document;
            doc.querySelectorAll('a').forEach(a => {
              const href = a.getAttribute('href');
              if (href && !href.startsWith('http') && !href.startsWith('#')) {
                a.onclick = (e) => {
                  e.preventDefault();
                  const cleanHref = href.replace(/^\.\//, '');
                  window.history.pushState({}, '', `?page=${cleanHref}`);
                  executePHP(cleanHref);
                };
              }
            });
          } catch(e) {}
        };

      } catch (err) {
        viewport.srcdoc = `<pre style="color:red;padding:20px;">Execution Error: ${err.message}</pre>`;
      } finally {
        php.removeEventListener('output', onOutput);
      }
    }

    window.addEventListener('popstate', () => {
      const urlParams = new URLSearchParams(window.location.search);
      executePHP(urlParams.get('page') || 'index.php');
    });

    initServer();
  </script>
</body>
</html>
