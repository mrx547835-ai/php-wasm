<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP-WASM Web Server</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
    
    /* লোডিং ও এরর বার */
    #status-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #4f46e5;
      color: white;
      padding: 6px 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      z-index: 9999;
    }
    
    /* রেন্ডার করা আউটপুট দেখানোর ফ্রেম */
    #viewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      margin-top: 30px; /* status-bar এর জন্য জায়গা */
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <span id="status-text">⏳ PHP Engine চালু হচ্ছে...</span>
    <span id="current-file">htdocs/index.php</span>
  </div>

  <iframe id="viewport"></iframe>

  <script type="module">
    import { PhpWeb } from 'https://cdn.jsdelivr.net/npm/php-wasm/PhpWeb.mjs';

    // আপনার htdocs ফোল্ডারের ফাইলগুলোর তালিকা
    // (GitHub যেহেতু স্ট্যাটিক, তাই include/require কাজ করতে ফাইলগুলোর নাম এখানে উল্লেখ রাখুন)
    const HTDOCS_FILES = [
      'index.php',
      'about.php',
      'header.php'
    ];

    let php;
    const statusText = document.getElementById('status-text');
    const currentFile = document.getElementById('current-file');
    const viewport = document.getElementById('viewport');

    // ১. PHP ইনিশিয়ালাইজ ও htdocs ফাইল লোড
    async function startServer() {
      try {
        php = new PhpWeb();
        statusText.textContent = '📥 ফাইলগুলো মেমোরিতে লোড হচ্ছে...';

        // htdocs ডিরেক্টরি তৈরি
        await php.run(`<?php @mkdir('/htdocs', 0777, true); ?>`);

        // GitHub থেকে htdocs এর ফাইলগুলো ফেচ করে WASM ভার্চুয়াল মেমোরিতে রাইট করা
        for (const file of HTDOCS_FILES) {
          try {
            const res = await fetch(`./htdocs/${file}?v=${Date.now()}`);
            if (res.ok) {
              const code = await res.text();
              // ফাইল ভার্চুয়াল স্টোরেজে সেভ করা
              await php.run(`<?php file_put_contents('/htdocs/${file}', base64_decode('${btoa(code)}')); ?>`);
            }
          } catch (e) {
            console.warn(`File ./htdocs/${file} লোড করা যায়নি`);
          }
        }

        statusText.textContent = '🟢 PHP Server Running';
        statusText.style.background = '#16a34a';

        // URL থেকে দেখে নেওয়া কোন পেজে যেতে হবে (যেমন: ?page=about.php)
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('page') || 'index.php';
        await renderPage(targetPage);

      } catch (err) {
        statusText.textContent = '❌ Error: ' + err.message;
        statusText.style.background = '#dc2626';
      }
    }

    // ২. নির্দিষ্ট PHP ফাইল এক্সিকিউট করে স্ক্রিনে দেখানো
    async function renderPage(filename) {
      currentFile.textContent = `htdocs/${filename}`;
      let outputBuffer = '';

      // আউটপুট ক্যাপচার করা
      const handleOutput = (event) => {
        const chunk = Array.isArray(event.detail) ? event.detail.join('') : event.detail;
        outputBuffer += chunk;
      };

      php.addEventListener('output', handleOutput);

      try {
        // রিকোয়েস্ট মেথড এবং পাথ সেট করে এক্সিকিউট করা
        const runnerScript = `<?php
          chdir('/htdocs');
          $_SERVER['DOCUMENT_ROOT'] = '/htdocs';
          $_SERVER['SCRIPT_NAME'] = '/${filename}';
          $_SERVER['REQUEST_METHOD'] = 'GET';
          
          if (file_exists('/htdocs/${filename}')) {
              include '/htdocs/${filename}';
          } else {
              echo "<h2>404 Not Found</h2><p>File /htdocs/${filename} পাওয়া যায়নি!</p>";
          }
        ?>`;

        await php.run(runnerScript);

        // রেন্ডার করা HTML আইফ্রেমের ভিতরে দেওয়া
        viewport.srcdoc = outputBuffer;

        // আইফ্রেমের ভেতরের সাধারণ লিংকগুলো ইন্টারসেপ্ট করা যেন পেজ রিফ্রেশ ছাড়া পেজ চেঞ্জ হয়
        viewport.onload = () => {
          const links = viewport.contentWindow.document.querySelectorAll('a');
          links.forEach(a => {
            const href = a.getAttribute('href');
            if (href && !href.startsWith('http') && !href.startsWith('#')) {
              a.onclick = (e) => {
                e.preventDefault();
                // পেজ ব্রাউজারের ইতিহাস এবং URL আপডেট
                const cleanHref = href.replace(/^\.\//, '');
                window.history.pushState({}, '', `?page=${cleanHref}`);
                renderPage(cleanHref);
              };
            }
          });
        };

      } catch (err) {
        viewport.srcdoc = `<pre style="color: red; padding: 20px;">Execution Error:\n${err.message}</pre>`;
      } finally {
        php.removeEventListener('output', handleOutput);
      }
    }

    // ব্রাউজারের ব্যাক/ফরোয়ার্ড বাটনের হ্যান্ডলিং
    window.addEventListener('popstate', () => {
      const urlParams = new URLSearchParams(window.location.search);
      renderPage(urlParams.get('page') || 'index.php');
    });

    startServer();
  </script>
</body>
</html>
