name: Generate htdocs File List

on:
  push:
    paths:
      - 'htdocs/**' # শুধুমাত্র htdocs ফোল্ডারে পরিবর্তন হলে ট্রিগার হবে
    branches:
      - main
      - master
  workflow_dispatch: # Actions ট্যাব থেকে ম্যানুয়ালিও রান করা যাবে

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate files.json
        run: |
          cd htdocs
          # htdocs এর ভেতরের সব ফাইল খুঁজে JSON অ্যারে বানানো
          find . -type f ! -path '*/.*' | sed 's|^\./||' | sort | jq -R . | jq -s . > ../files.json
          cd ..
          echo "Generated files.json successfully:"
          cat files.json

      - name: Commit and Push files.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --staged --quiet || (git commit -m "Auto-generate files.json [skip ci]" && git push)
